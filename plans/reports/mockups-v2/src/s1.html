<style>
  /* Tối giản: paper and ink, hairlines, left-aligned large light type, line-art shield, nothing bounces */
  .screen { --card-line: 0; --field-line: 0; --row-line: 1px solid #1B1A171F; --link: var(--ink); --hair: 1px solid #1B1A1726; }
  .a-top h1 { font-size: 15px; font-weight: 500; letter-spacing: 0.01em; color: var(--muted); }
  .a-help { border: var(--hair); color: var(--muted); }
  .a-hero { padding: 28px 24px 28px; }
  .a-shield { width: 44px; height: 50px; margin-bottom: 20px; }
  .shield .body { fill: none; stroke: var(--state); stroke-width: 7; }
  .shield .shine, .shield .core { display: none; }
  .shield .mark { fill: none; stroke: var(--state); stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; }
  .a-hero h2 { font-size: 40px; font-weight: 300; letter-spacing: -0.03em; line-height: 1.05; }
  .a-hero p { font-size: 17px; color: var(--muted); margin-top: 10px; }
  .a-cta { padding: 0 0 2px; font-size: 17px; font-weight: 600; color: var(--state); border-bottom: 2px solid var(--state); border-radius: 0; }
  .a-sect { font-size: 13px; font-weight: 500; color: var(--muted); padding-top: 16px; border-top: var(--hair); margin: 0 24px 0; padding-left: 0; }
  .a-list { margin: 0 24px; }
  .row-in { padding: 16px 0; }
  .row .n { font-size: 20px; font-weight: 400; letter-spacing: 0.01em; }
  .tag { padding: 0; font-size: 12px; font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase; }
  .empty { border: 0; text-align: left; padding: 20px 0; }
  .empty b { font-weight: 500; }
  .a-dock { background: var(--bg); border-top: var(--hair); }
  .sheet { box-shadow: 0 -1px 0 #1B1A1726; }
  .sheet header h2 { font-weight: 500; }
  .field { border-bottom: 2px solid var(--ink); padding: 0; height: 56px; }
  .field:focus-within { border-color: var(--on); }
  .field input { font-size: 26px; font-weight: 300; }
  .live { background: none; padding: 12px 0; border-radius: 0; min-height: 64px; }
  .live[data-kind="one"], .live[data-kind="prefix"] { background: none; }
  .live b { font-weight: 500; }
  .chip { background: none; border: var(--hair); }
  .steps li { background: none; border: 0; border-bottom: var(--hair); border-radius: 0; padding: 14px 0; }
  .steps li::before { background: none; color: var(--muted); border: var(--hair); }
  .toast { border-radius: 10px; }
</style>
