<style>
  /* Tương phản cao: black, white, one yellow. 2px outlines, square corners, heavy type, mono labels, words on every state */
  .screen { --mono: ui-monospace, "SF Mono", Menlo, "Roboto Mono", monospace; --line: 2px solid #fff; --card-line: var(--line); --field-line: var(--line); --row-line: 2px solid #ffffff55; --focus: 4px solid #FFD60A; --link: #FFD60A; font-size: 19px; }
  .a-top h1 { font: 700 13px/1 var(--mono); letter-spacing: 0.12em; text-transform: uppercase; }
  .a-help { border: var(--line); border-radius: 6px; font-weight: 800; }
  .a-hero { margin: 8px 16px 12px; padding: 20px; border: var(--line); border-radius: 6px; display: grid; grid-template-columns: auto 1fr; column-gap: 16px; align-items: center; }
  [data-prot="off"] .a-hero { border-style: dashed; background: repeating-linear-gradient(135deg, #000 0 10px, #ffffff1f 10px 12px); }
  .a-shield { width: 64px; height: 72px; grid-row: span 2; }
  .shield .body { fill: var(--on); stroke: none; }
  .shield .shine { display: none; } .shield .core { fill: #000; }
  .shield .mark { fill: none; stroke: var(--on); stroke-width: 8; stroke-linecap: square; }
  [data-prot="off"] .shield .body { fill: #000; stroke: #fff; stroke-width: 5; }
  [data-prot="off"] .shield .core { fill: #fff; } [data-prot="off"] .shield .mark { stroke: #000; }
  .a-hero h2 { font-size: 30px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
  .a-hero p { font-size: 17px; color: var(--muted); }
  .a-cta { grid-column: 1 / -1; height: 60px; border-radius: 6px; background: var(--accent); color: #000; font-size: 19px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; }
  .a-sect { font: 700 13px/1.2 var(--mono); letter-spacing: 0.1em; text-transform: uppercase; padding: 0 16px; margin-top: 20px; }
  .row .n { font-size: 22px; font-weight: 800; }
  .row .d, .row .note { font-size: 15px; }
  .tag { font: 700 12px/1.3 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; padding: 0; }
  .switch { width: 76px; height: 44px; border-radius: 6px; border: var(--line); background: #000; }
  .switch::after { display: none; }
  .switch::before { content: "TẮT"; inset: 0; top: 0; height: auto; border-radius: 0; background: none !important; display: grid; place-items: center; font: 800 15px/1 var(--mono); color: #fff; }
  .switch[aria-checked="true"] { border-color: var(--accent); background: var(--accent); }
  .switch[aria-checked="true"]::before { content: "BẬT"; color: #000; }
  .row.paused .main { opacity: 1; } .row.paused .n { text-decoration: line-through; text-decoration-thickness: 2px; }
  .empty { border: 2px dashed #fff; }
  .btn { font-size: 19px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; }
  .btn:disabled { opacity: 1; background: #000; color: #fff; border: 2px dashed #fff; }
  .a-dock { background: #000; border-top: var(--line); }
  .a-foot { font-size: 14px; }
  .sheet { border-top: var(--line); }
  .sheet header h2 { font: 700 15px/1 var(--mono); letter-spacing: 0.1em; text-transform: uppercase; }
  .lbl { font-size: 16px; color: #fff; font-weight: 700; }
  .field { height: 64px; } .field input { font-size: 26px; font-weight: 800; }
  .field input::placeholder { color: var(--muted); font-size: 16px; }
  .chip { background: #000; border: var(--line); border-radius: 6px; font-size: 15px; font-weight: 700; }
  .live { background: #000; border: 2px dashed #fff; font-size: 15px; color: #fff; }
  .live[data-kind="one"], .live[data-kind="prefix"] { border: 0; }
  .live[data-kind="error"]::before { content: "⚠ CHƯA CHẶN ĐƯỢC"; font: 800 12px/1.6 var(--mono); letter-spacing: 0.08em; }
  .live b { font-size: 20px; font-weight: 800; }
  .try, .try button, .sub, .foot { font-size: 14px; color: #fff; }
  .steps li { font-size: 17px; font-weight: 600; } .steps li::before { border-radius: 4px; font-size: 15px; }
  .toast { border-radius: 6px; font-size: 16px; font-weight: 800; }
  .home-ind { opacity: 0.9; }
</style>
